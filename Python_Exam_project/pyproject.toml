[project]
name = "prime"
version = "0.1.0"
description = "Система мониторинга ПРАЙМ"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "loguru>=0.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
    "streamlit>=1.39",
]

[project.scripts]
prime = "prime.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]